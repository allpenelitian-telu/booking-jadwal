<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Jadwal Dosen</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- Main Content Wrapper -->
  <div>
    <!-- Header Profil Dosen & Navigasi Minggu -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-full bg-slate-900 text-white flex items-center font-bold text-lg justify-center shadow">
            DS
          </div>
          <div>
            <h1 class="font-bold text-lg text-slate-900">Jadwal Temu Dosen</h1>
            <p class="text-xs text-slate-500">Senin – Jumat | 08:00 – 20:00 WIB (Interval 30 Menit)</p>
          </div>
        </div>

        <!-- Navigasi Minggu (Previous / Next Week) -->
        <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-xl border border-slate-200">
          <button onclick="changeWeek(-1)" class="px-3 py-1.5 text-xs font-semibold bg-white rounded-lg shadow-sm hover:bg-slate-50 transition text-slate-700">&larr; Minggu Lalu</button>
          <span id="weekLabel" class="text-xs font-bold px-2 text-slate-700 min-w-[140px] text-center">--</span>
          <button onclick="changeWeek(1)" class="px-3 py-1.5 text-xs font-semibold bg-white rounded-lg shadow-sm hover:bg-slate-50 transition text-slate-700">Minggu Depan &rarr;</button>
        </div>
      </div>
    </header>

    <!-- Main Content: Kanban Board -->
    <main class="max-w-7xl mx-auto px-4 mt-6">
      <div id="loadingStatus" class="hidden text-center py-4 text-xs font-semibold text-slate-500">
        ⏳ Menyinkronkan jadwal dari Google Calendar...
      </div>
      <div class="grid grid-cols-1 md:grid-cols-5 gap-4 overflow-x-auto" id="kanbanBoard">
        <!-- Kolom Senin - Jumat di-render via JavaScript -->
      </div>
    </main>
  </div>

  <!-- Modal Form Booking -->
  <div id="bookingModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative border border-slate-100 max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      
      <h2 class="text-xl font-bold text-slate-900 mb-1">Ajukan Jadwal Temu</h2>
      <p id="selectedSlotText" class="text-xs font-semibold text-indigo-600 mb-4 bg-indigo-50 p-2.5 rounded-lg block"></p>

      <form id="bookingForm" onsubmit="submitBooking(event)" class="space-y-4">
        <!-- Pilihan Durasi Pertemuan -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Durasi Pertemuan *</label>
          <select id="durasi" onchange="updateEndTime()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-900 outline-none bg-white">
            <option value="30">30 Menit</option>
            <option value="60">1 Jam (60 Menit)</option>
            <option value="90">1.5 Jam (90 Menit)</option>
            <option value="120">2 Jam (120 Menit)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap *</label>
          <input type="text" id="nama" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-900 outline-none" placeholder="Masukkan nama lengkap Anda">
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Email *</label>
            <input type="email" id="email" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-900 outline-none" placeholder="nama@email.com">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">No. WhatsApp *</label>
            <input type="tel" id="wa" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-900 outline-none" placeholder="08123456789">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Judul Agenda / Topik *</label>
          <input type="text" id="judul" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-900 outline-none" placeholder="Contoh: Bimbingan Skripsi / Konsultasi Matkul">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Keterangan / Detail Agenda</label>
          <textarea id="keterangan" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-900 outline-none" placeholder="Penjelasan singkat mengenai topik yang ingin dibahas..."></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Attachment / Lampiran Berkas (Opsional)</label>
          <input type="file" id="attachment" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200">
        </div>

        <div class="pt-3">
          <button type="submit" id="submitBtn" class="w-full bg-slate-900 text-white font-medium text-sm py-2.5 rounded-lg hover:bg-slate-800 transition shadow">
            Kirim Pengajuan
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Detail Event Terisi -->
  <div id="detailModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative border border-slate-100">
      <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      
      <div class="flex items-center gap-2 mb-3">
        <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
        <span class="text-xs font-semibold uppercase tracking-wider text-rose-600">Terisi / Booked</span>
      </div>

      <h3 id="detailTitle" class="text-lg font-bold text-slate-900 mb-2"></h3>
      <p id="detailTime" class="text-xs font-medium text-slate-500 mb-4 bg-slate-50 p-2.5 rounded-lg border border-slate-100"></p>

      <div class="text-xs text-slate-600 space-y-2">
        <p><strong>Pemohon:</strong> <span id="detailPemohon">--</span></p>
      </div>

      <div class="mt-6 pt-3 border-t border-slate-100 flex justify-end">
        <button onclick="closeDetailModal()" class="bg-slate-100 text-slate-700 px-4 py-2 rounded-lg text-xs font-semibold hover:bg-slate-200">Tutup</button>
      </div>
    </div>
  </div>

  <!-- Footer Aplikasi -->
  <footer class="mt-12 py-6 border-t border-slate-200 bg-white text-center">
    <p class="text-xs font-medium text-slate-500">Dibuat oleh ANM 2026</p>
  </footer>

  <script>
    // WEB APP URL GOOGLE APPS SCRIPT LENGKAP
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwMquagyF8HYAdm2PgEA8rsUoSelS6C9CPWUuRrzf5mvjaWCXEWA18Ntb1jt31wTCohMw/exec";

    let currentMonday = getMonday(new Date());
    let bookedEvents = [];
    let selectedDateString = null;
    let baseStartHour = null;
    let baseStartMinute = null;
    let currentDayName = "";

    const dayNames = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat"];

    window.onload = () => {
      fetchEventsAndRender();
    };

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function changeWeek(offset) {
      currentMonday.setDate(currentMonday.getDate() + (offset * 7));
      fetchEventsAndRender();
    }

    async function fetchEventsAndRender() {
      const loading = document.getElementById('loadingStatus');
      loading.classList.remove('hidden');

      const currentFriday = new Date(currentMonday);
      currentFriday.setDate(currentFriday.getDate() + 4);

      const startISO = `${currentMonday.toISOString().split('T')[0]}T00:00:00Z`;
      const endISO = `${currentFriday.toISOString().split('T')[0]}T23:59:59Z`;

      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?start=${startISO}&end=${endISO}`);
        const result = await res.json();
        if (result.status === 'success') {
          bookedEvents = result.data || [];
        }
      } catch (err) {
        console.error("Gagal mengambil data jadwal:", err);
      } finally {
        loading.classList.add('hidden');
        renderKanban();
      }
    }

    function renderKanban() {
      const board = document.getElementById('kanbanBoard');
      board.innerHTML = '';

      const currentFriday = new Date(currentMonday);
      currentFriday.setDate(currentFriday.getDate() + 4);

      const optionsMonth = { day: 'numeric', month: 'short' };
      const startStr = currentMonday.toLocaleDateString('id-ID', optionsMonth);
      const endStr = currentFriday.toLocaleDateString('id-ID', { ...optionsMonth, year: 'numeric' });
      document.getElementById('weekLabel').innerText = `${startStr} - ${endStr}`;

      dayNames.forEach((dayName, index) => {
        const colDate = new Date(currentMonday);
        colDate.setDate(colDate.getDate() + index);

        const dateISO = colDate.toISOString().split('T')[0];
        const dateFormatted = colDate.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

        const col = document.createElement('div');
        col.className = "bg-white rounded-xl border border-slate-200 p-3 flex flex-col gap-2 shadow-sm min-w-[200px]";
        
        col.innerHTML = `
          <div class="pb-2 border-b border-slate-100">
            <div class="font-bold text-sm text-slate-800">${dayName}</div>
            <div class="text-[11px] text-slate-500 font-medium">${dateFormatted}</div>
          </div>
        `;

        for (let hour = 8; hour < 20; hour++) {
          ["00", "30"].forEach(minute => {
            const timeStart = `${String(hour).padStart(2, '0')}:${minute}`;
            const nextHour = minute === "30" ? hour + 1 : hour;
            const nextMinute = minute === "30" ? "00" : "30";
            const timeEnd = `${String(nextHour).padStart(2, '0')}:${nextMinute}`;

            const slotTimeStart = new Date(`${dateISO}T${timeStart}:00`);
            const slotTimeEnd = new Date(`${dateISO}T${timeEnd}:00`);

            // Cek apakah slot waktu ini berbenturan dengan event yang sudah di-booking
            const existingEvent = bookedEvents.find(ev => {
              const evStart = new Date(ev.startTime);
              const evEnd = new Date(ev.endTime);
              return slotTimeStart < evEnd && slotTimeEnd > evStart;
            });

            const slotBtn = document.createElement('button');
            
            if (existingEvent) {
              slotBtn.className = "text-xs p-2.5 rounded-lg border border-rose-200 bg-rose-50 text-rose-700 text-left font-medium flex justify-between items-center cursor-pointer";
              slotBtn.innerHTML = `
                <div class="truncate max-w-[110px]">
                  <div class="font-bold text-[11px] truncate">${existingEvent.title}</div>
                  <div class="text-[10px] opacity-75">${timeStart} - ${timeEnd}</div>
                </div>
                <span class="text-[9px] bg-rose-200 text-rose-800 px-1.5 py-0.5 rounded font-bold">Terisi</span>
              `;
              slotBtn.onclick = () => openDetailModal(existingEvent);
            } else {
              slotBtn.className = "text-xs p-2.5 rounded-lg border border-dashed border-slate-300 hover:border-slate-900 hover:bg-slate-50 transition text-slate-600 text-left font-medium flex justify-between items-center";
              slotBtn.innerHTML = `<span>${timeStart} - ${timeEnd}</span> <span class="text-[10px] text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded font-semibold">Tersedia</span>`;
              slotBtn.onclick = () => openBookingModal(dayName, dateFormatted, dateISO, timeStart);
            }

            col.appendChild(slotBtn);
          });
        }
        board.appendChild(col);
      });
    }

    function openBookingModal(dayName, dateFormatted, dateISO, start) {
      currentDayName = `${dayName}, ${dateFormatted}`;
      selectedDateString = dateISO;
      
      const [h, m] = start.split(':');
      baseStartHour = parseInt(h);
      baseStartMinute = parseInt(m);

      document.getElementById('durasi').value = "30";
      updateEndTime();

      document.getElementById('bookingModal').classList.remove('hidden');
    }

    function updateEndTime() {
      const durationMinutes = parseInt(document.getElementById('durasi').value);
      
      const startDateTime = new Date(`${selectedDateString}T${String(baseStartHour).padStart(2, '0')}:${String(baseStartMinute).padStart(2, '0')}:00`);
      const endDateTime = new Date(startDateTime.getTime() + durationMinutes * 60000);

      if (endDateTime.getHours() > 20 || (endDateTime.getHours() === 20 && endDateTime.getMinutes() > 0)) {
        alert('Durasi yang dipilih melebihi jam kerja operasional (Maksimal s/d jam 20:00 WIB).');
        document.getElementById('durasi').value = "30";
        updateEndTime();
        return;
      }

      selectedStartTime = startDateTime.toISOString();
      selectedEndTime = endDateTime.toISOString();

      const startStr = `${String(baseStartHour).padStart(2, '0')}:${String(baseStartMinute).padStart(2, '0')}`;
      const endStr = `${String(endDateTime.getHours()).padStart(2, '0')}:${String(endDateTime.getMinutes()).padStart(2, '0')}`;

      document.getElementById('selectedSlotText').innerText = `📅 ${currentDayName} | Waktu: ${startStr} - ${endStr} WIB (${durationMinutes} Menit)`;
    }

    function closeModal() {
      document.getElementById('bookingModal').classList.add('hidden');
      document.getElementById('bookingForm').reset();
    }

    function openDetailModal(ev) {
      document.getElementById('detailTitle').innerText = ev.title;
      
      const start = new Date(ev.startTime).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      const end = new Date(ev.endTime).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('detailTime').innerText = `🕒 Rentang Waktu: ${start} - ${end} WIB`;
      
      document.getElementById('detailPemohon').innerText = ev.namaPemohon || "Informasi Privat";
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    async function submitBooking(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Mengirim...";

      const fileInput = document.getElementById('attachment');
      let attachmentData = null;

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const base64 = await convertBase64(file);
        attachmentData = {
          fileName: file.name,
          mimeType: file.type,
          base64: base64
        };
      }

      const payload = {
        nama: document.getElementById('nama').value,
        email: document.getElementById('email').value,
        wa: document.getElementById('wa').value,
        judul: document.getElementById('judul').value,
        keterangan: document.getElementById('keterangan').value,
        startTime: selectedStartTime,
        endTime: selectedEndTime,
        attachment: attachmentData
      };

      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        
        const result = await res.json();

        if (result.status === 'success') {
          alert('Berhasil! Jadwal telah diajukan dan dicatat di Google Calendar.');
          closeModal();
          fetchEventsAndRender();
        } else {
          alert('Gagal: ' + result.message);
        }
      } catch (err) {
        alert('Terjadi kesalahan koneksi ke server Apps Script.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Kirim Pengajuan";
      }
    }

    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const fileReader = new FileReader();
        fileReader.readAsDataURL(file);
        fileReader.onload = () => resolve(fileReader.result);
        fileReader.onerror = (error) => reject(error);
      });
    }
  </script>
</body>
</html>
